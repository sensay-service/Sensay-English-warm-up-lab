const rounds=[
{zh:'英文冷知識',en:'English trivia',sub:'CURIOUS MINDS',desc:['小小的英文，大大的驚喜。\n憑直覺猜猜看，你知道幾個？','Small words, big surprises. Trust your instincts and see what you know.'],questions:[
{zh:'小寫 i 和 j 上面的那個點，有自己的英文名字嗎？',en:'Does the dot above a lowercase i or j have its own name?',opts:[['Tittle','Dotlet','Minidot'],['Tittle','Dotlet','Minidot']],key:0,answer:['有！它叫 tittle。','Yes! It is called a tittle.'],ex:['Tittle 是小寫 i 和 j 上方小點的名稱。這個不起眼的小點，也有自己的正式名字！','The small dot above a lowercase i or j is called a tittle. Even a tiny dot has a name!'],source:['Dictionary.com','https://www.dictionary.com/articles/tittle']},
{zh:'英文裡的「冷知識」，哪個說法最合適？',en:'Which English expression best describes 「冷知識」?',opts:[['Cold knowledge','Ice fact','Trivia','Dark trivia'],['Cold knowledge','Ice fact','Trivia','Dark trivia']],key:2,answer:['Trivia','Trivia'],ex:['Trivia 指趣味、瑣碎或較少人知道的小知識。分享一則冷知識，也可以用 a fun fact，並不是直譯成 cold knowledge。','Trivia means interesting or little-known pieces of information. For a single item, you can also say “a fun fact.” “Cold knowledge” is not the usual expression.']},
{zh:'英文單字中，哪一個動詞擁有的「意思」最多、最常被使用？',en:'Which English verb has the most meanings and is used most often?',opts:[['Have','Do','Run','Get'],['Have','Do','Run','Get']],key:2,answer:['Run','Run'],ex:['這個只有三個字母的單字，動詞型態就有高達 645 個不同字義！根據 Simon Winchester 於 2011 年在《紐約時報》的文章，OED 詞典編輯 Peter Gilliver 為 run 整理出 645 個動詞字義。例如：run a race（跑比賽）、run a business（經營事業）、the machine is running（機器正在運轉）。這項數字指字義數量，並不是使用頻率排名。','Just three letters, but 645 verb senses! In a 2011 New York Times article, Simon Winchester reported that OED lexicographer Peter Gilliver had identified 645 senses of the verb run. Examples include run a race, run a business, and “the machine is running.” This counts meanings, not frequency of use.'],source:['Simon Winchester · 2011','https://www.nytimes.com/2011/05/29/opinion/29winchester.html']},
{zh:'每個英文單字都一定包含 a、e、i、o、u 其中一個字母。',en:'Every English word must contain at least one of the letters a, e, i, o, u.',opts:[['是','不是'],['Yes','No']],key:1,answer:['不是，例如 myth、rhythm。','No — for example, myth and rhythm.'],ex:['Myth、rhythm、gym 都沒有 a、e、i、o、u。在這些單字裡，y 可以代表母音音素。「母音字母」與「母音聲音」是不同概念。','Myth, rhythm and gym contain none of those five letters. In these words, y represents a vowel sound. Vowel letters and vowel sounds are different concepts.']},
{zh:'一句英文可以包含 26 個英文字母嗎？',en:'Can one English sentence contain all 26 letters of the alphabet?',opts:[['可以','不可以'],['Yes','No']],key:0,answer:['可以！這叫全字母句（pangram）。','Yes! It is called a pangram.'],ex:['全字母句包含全部 26 個英文字母，每個字母至少出現一次，不必剛好只用 26 個字母。試試找出例句裡的 A 到 Z！','A pangram contains every letter of the alphabet at least once. It does not have to contain exactly 26 letters. Can you spot all 26 in this example?'],pangram:true}
]},
{zh:'英文謎語',en:'Riddle me this',sub:'THINK SIDEWAYS',desc:['別急著照字面理解。\n答案可能藏在雙關語裡！','Think beyond the literal meaning. The answer may be hiding in a wordplay!'],questions:[
{zh:'What is the smallest room in the world?',en:'What is the smallest room in the world?',accept:['mushroom','a mushroom'],answer:['Mushroom（蘑菇）','Mushroom'],hint:['提示：它是一種食物。','Hint: it is a type of food.'],ex:['Mushroom 裡有 room 這段字母，但意思是「蘑菇」。這是文字遊戲，並不是在比較房間大小。','Mushroom contains the letters “room,” but it is a fungus, not a room. This is wordplay, not a literal size comparison.']},
{zh:'What begins with T, ends with T, and has T in it?',en:'What begins with T, ends with T, and has T in it?',accept:['teapot','a teapot','tea pot'],answer:['Teapot（茶壺）','Teapot'],hint:['提示：中間的 T 用耳朵聽。','Hint: listen to the sound of the T in the middle.'],ex:['Teapot 以 t 開頭、以 t 結尾，裡面裝著 tea（茶）。字母 T 與 tea 的發音相同！','Teapot starts and ends with t and has tea inside it. The letter T sounds like “tea.”']},
{zh:'Where does afternoon come before morning?',en:'Where does afternoon come before morning?',accept:['dictionary','a dictionary','the dictionary','in a dictionary','in the dictionary'],answer:['Dictionary（字典）','A dictionary'],hint:['提示：想想排列順序。','Hint: think about alphabetical order.'],ex:['字典依字母排序。Afternoon 以 a 開頭，morning 以 m 開頭，所以 afternoon 會排在 morning 前面。','Dictionaries arrange words alphabetically. Afternoon begins with a, so it appears before morning, which begins with m.']},
{zh:'What always goes up and never goes down?',en:'What always goes up and never goes down?',accept:['age','your age','my age','our age'],answer:['Age（年齡）','Age'],hint:['提示：每年生日都會改變。','Hint: it changes every birthday.'],ex:['年齡只會隨時間增加，不會倒退。這裡的 goes up 指「增加」。','Your age increases with time and never decreases. Here, “goes up” means increases.']},
{zh:'What fruit is never found singly?',en:'What fruit is never found singly?',accept:['pear','a pear','pears'],answer:['Pear（梨子）','A pear'],hint:['提示：答案的發音跟「一對」一樣。','Hint: the answer sounds like “a pair.”'],ex:['Pear（梨子）與 pair（一對）同音，所以笑點是「總是一對」。這是諧音梗，梨子當然也能單顆出現！','Pear sounds like pair, so the joke is that it always comes in a pair. It is a pun — real pears can, of course, be found singly.']}
]},
{zh:'字母重組',en:'Word scramble',sub:'SHAKE THINGS UP',desc:['把字母重新排列成一個英文單字。\n有些題目不只有一個答案！','Rearrange every letter to make an English word. Some puzzles have more than one answer!'],questions:[
{letters:'ARTHE',accept:['earth','heart','hater','rathe'],answer:['EARTH / HEART / HATER','EARTH / HEART / HATER'],ex:['這組字母可以拼出 earth（地球）、heart（心臟）或 hater（討厭某事的人）等單字。每個字母都要用一次。','These letters can form earth, heart or hater, among other words. Use every letter exactly once.']},
{letters:'AEHCTRE',accept:['teacher','cheater','hectare','reteach'],answer:['TEACHER / CHEATER / HECTARE / RETEACH','TEACHER / CHEATER / HECTARE / RETEACH'],ex:['Teacher（老師）、cheater（作弊者）、hectare（公頃）與 reteach（重新教學）都由同一組字母組成！','Teacher, cheater, hectare and reteach all use the same seven letters!']},
{letters:'TAERC',accept:['trace','react','crate','cater','caret','carte','recta'],answer:['TRACE / REACT / CRATE / CATER / CARET / CARTE','TRACE / REACT / CRATE / CATER / CARET / CARTE'],ex:['可拼出 trace（追蹤）、react（反應）、crate（板條箱）、cater（提供餐飲）、caret（插入符號）等。','Possible words include trace, react, crate, cater and caret. The same letters can produce very different meanings.']},
{letters:'LOWBE',accept:['below','elbow','bowel'],answer:['BELOW / ELBOW / BOWEL','BELOW / ELBOW / BOWEL'],ex:['Below（在下方）、elbow（手肘）與 bowel（腸）都是正確答案。','Below, elbow and bowel are all valid answers.']},

let lang='zh',r=0,q=0,view='question';let playerName='',started=false,sendState='idle',pending=null;const ENDPOINT='https://script.google.com/macros/s/AKfycbwS_nBhdO40otryjKLxde4iGl__FFCIUXAo6fRqKbp4phuUn4PafAjsvkxpTsrT9vCx-Q/exec';const answers=rounds.map(x=>x.questions.map(()=>''));const $=id=>document.getElementById(id);const node=(tag,cls,text)=>{let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};const idx=()=>lang==='zh'?0:1;const normalize=s=>String(s).toLowerCase().trim().replace(/[.!?]+$/,'').replace(/\s+/g,' ');function correct(item,a){return item.opts?String(a)===String(item.key):item.accept.includes(normalize(a))}function persist(){if(!started&&$('player-name'))playerName=$('player-name').value;if(view==='question'){const input=$('answer');if(input)answers[r][q]=input.value}}function jumpFocus(){const h=$('card').querySelector('h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}$('steps').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){const t=ui[lang],k=idx();document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));$('hero-tag').textContent=t.tag;$('hero-title').innerHTML=t.title;$('hero-intro').innerHTML=t.intro;$('hero-meta').replaceChildren(...t.meta.map(s=>node('span','',s)));$('footer-note').textContent=lang==='zh'?'完成後，姓名／暱稱、分數與答案將提供給 Sensay 活動主辦方。':'On completion, your name/nickname, score and answers will be shared with the Sensay organizer.';$('side-note').textContent=t.note;$('steps').replaceChildren();rounds.forEach((round,i)=>{let n=node('div','step '+(view==='results'?'done':i===r?'active':i<r?'done':''));n.append(node('span','step-num',i<r||view==='results'?'✓':String(i+1)));let label=node('div');label.append(node('strong','',round[lang]),node('small','',round.sub),node('p','unit-description',round.desc[k]));n.append(label);if(i===r)n.setAttribute('aria-current','step');$('steps').append(n)});let completed=view==='results'?15:r*5+(view==='intermission'?5:q);$('bar').style.width=(completed/15*100)+'%';$('counter').textContent=t.total;$('total').textContent=completed+' / 15';$('round-label').textContent=view==='results'?t.summary:`${t.round} ${String(r+1).padStart(2,'0')} ${t.of}`;$('round-title').textContent=view==='results'?t.summaryTitle:rounds[r][lang];$('round-description').textContent=view==='results'?t.allDone:rounds[r].desc[k];$('card').replaceChildren();if(!started)return renderWelcome();if(view==='results')return renderResults();if(view==='intermission'){let box=node('div','section-end');box.append(node('div','big-icon','✧'),node('h2','',t.roundDone),node('p','',t.roundDoneText));let b=node('button','btn',r===2?t.results:t.continue);b.onclick=()=>{if(r===2){view='results';queueSubmission();}else{r++;q=0;view='question'}render();jumpFocus()};box.append(b);$('card').append(box);return}
let item=rounds[r].questions[q];const form=node('form');form.noValidate=true;const top=node('div','card-top');top.append(node('span','',rounds[r].sub),node('span','',String(q+1).padStart(2,'0')+' / 05'));form.append(top);let h=node('h2','qtitle',item.letters?(lang==='zh'?'用這些字母，拼出一個英文單字。':'Rearrange these letters into an English word.'):item[lang]);h.id='question-label';form.append(h);if(item.letters){let letters=node('div','letters');letters.setAttribute('aria-label',item.letters.split('').join(' '));item.letters.split('').forEach(l=>letters.append(node('span','letter',l)));form.append(letters)}if(item.opts){let group=node('div','options');group.setAttribute('role','radiogroup');group.setAttribute('aria-labelledby','question-label');item.opts[k].forEach((s,i)=>{let label=node('label','option'),input=node('input');input.type='radio';input.name='answer';input.value=i;input.checked=String(answers[r][q])===String(i);input.onchange=()=>{answers[r][q]=String(i);$('error').hidden=true};label.append(input,node('span','',s));group.append(label)});form.append(group)}else{let input=node('input','answer-input');input.id='answer';input.type='text';input.maxLength=80;input.value=answers[r][q];input.placeholder=t.input;input.autocomplete='off';input.spellcheck=false;input.setAttribute('aria-labelledby','question-label');input.oninput=()=>answers[r][q]=input.value;form.append(input,node('p','hint',t.skip));if(item.hint){let detail=node('details');detail.append(node('summary','hint',lang==='zh'?'給我一點提示':'Give me a hint'),node('p','hint',item.hint[k]));form.append(detail)}}let err=node('p','error',t.required);err.id='error';err.hidden=true;err.setAttribute('role','alert');form.append(err);let actions=node('div','actions'),back=node('button','ghost',t.back);back.type='button';back.disabled=r===0&&q===0;back.onclick=()=>{persist();if(q>0)q--;else{r--;q=4}render();jumpFocus()};let next=node('button','btn',q===4?t.finish:t.next);next.type='submit';actions.append(back,next);form.append(actions);form.onsubmit=e=>{e.preventDefault();persist();if(item.opts&&answers[r][q]===''){$('error').hidden=false;return}if(q===4)view='intermission';else q++;render();jumpFocus()};$('card').append(form)}
function renderResults(){const t=ui[lang],k=idx();let score=rounds.reduce((sum,round,i)=>sum+round.questions.filter((item,j)=>correct(item,answers[i][j])).length,0);let head=node('div','section-end');head.append(node('div','eyebrow',t.review));let big=node('div','score',String(score)+' ');big.append(node('small','','/ 15'));head.append(big,node('h2','',t.summaryTitle),node('p','',t.reviewSub));$('card').append(head);rounds.forEach((round,i)=>{let title=node('h2','',round[lang]);title.style.cssText='margin-top:36px;font-size:23px';$('card').append(title);round.questions.forEach((item,j)=>{let a=answers[i][j],ok=correct(item,a),review=node('article','review');review.append(node('span','badge '+(ok?'good':'bad'),ok?'✓ '+t.right:'↗ '+t.wrong),node('h3','',`${i*5+j+1}. ${item.letters?item.letters.split('').join(' '):item[lang]}`));review.append(node('p','',t.your+(a===''?t.blank:item.opts?item.opts[k][Number(a)]:a)),node('p','correct-answer',t.answer+item.answer[k]),node('p','',item.ex[k]));if(item.pangram){review.append(node('p','pangram','The quick brown fox jumps over a lazy dog.'));if(lang==='zh')review.append(node('p','','這隻敏捷的棕色狐狸跳過了一隻懶狗。'));}if(item.source){let a=node('a','hint',t.source+' · '+item.source[0]);a.href=item.source[1];a.target='_blank';a.rel='noopener noreferrer';review.append(a)}$('card').append(review)});if(i===2)$('card').append(node('p','hint',t.other))});let restart=node('button','btn',t.retry);restart.onclick=()=>{rounds.forEach((round,i)=>round.questions.forEach((_,j)=>answers[i][j]=''));r=0;q=0;view='question';started=false;pending=null;sendState='idle';render();jumpFocus()};const status=node('p','hint');status.id='send-status';status.setAttribute('role','status');$('card').append(status);if(sendState==='error'){const retry=node('button','ghost',lang==='zh'?'重試傳送':'Retry sending');retry.onclick=sendSubmission;$('card').append(retry)}restart.disabled=sendState==='sending';$('card').append(restart);updateSendStatus()}
function renderWelcome(){const form=node('form');form.append(node('div','eyebrow',lang==='zh'?'準備暖身':'READY TO PLAY'),node('h2','qtitle',lang==='zh'?'先來打個招呼！':'Let’s say hello!'));const label=node('label','',lang==='zh'?'姓名／暱稱':'Name / nickname');label.htmlFor='player-name';const input=node('input','answer-input');input.id='player-name';input.required=true;input.maxLength=100;input.autocomplete='name';input.value=playerName;input.placeholder=lang==='zh'?'例如：Momo 老師':'e.g. Teacher Momo';input.oninput=()=>playerName=input.value;form.append(label,input,node('p','hint',lang==='zh'?'讓我們知道你是誰！請輸入姓名或暱稱 😊':'Let us know who’s joining! Enter your name or nickname 😊'),node('p','hint',lang==='zh'?'完成全部關卡後，主辦方將收到你的姓名、成績與答案。':'After you finish all rounds, the organizer will receive your name, score and answers.'));const button=node('button','btn',lang==='zh'?'開始暖場 →':'Let’s play →');button.type='submit';form.append(button);form.onsubmit=e=>{e.preventDefault();if(!input.value.trim()){input.setCustomValidity(lang==='zh'?'請輸入姓名或暱稱':'Please enter a name');input.reportValidity();input.setCustomValidity('');return}playerName=input.value.trim();started=true;render();jumpFocus()};$('card').append(form)}
function queueSubmission(){if(pending)return;pending={quiz:'warmup-v1',submissionId:crypto.randomUUID(),name:playerName,language:lang,answers:answers.flat()};sendState='sending';sendSubmission()}
function updateSendStatus(){const el=$('send-status');if(el)el.textContent=lang==='zh'?({idle:'',sending:'正在傳送作答紀錄…',sent:'你的答案已送出，感謝參與！',error:'傳送未完成，請檢查網路並重試。'})[sendState]:({idle:'',sending:'Sending your answers…',sent:'Your answers have been sent. Thank you for participating!',error:'The request did not complete. Check your connection and retry.'})[sendState]}
async function sendSubmission(){if(!pending)return;sendState='sending';updateSendStatus();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',body:new URLSearchParams({data:JSON.stringify(pending)}),signal:controller.signal});sendState='sent'}catch{sendState='error'}finally{clearTimeout(timer);if(view==='results')render()}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{persist();lang=b.dataset.lang;render()});render();
